name: citizen_app
description: Smart Civic – Mobile App for Civic Issue Reporting
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ── Firebase ────────────────────────────────────────────────
  firebase_core:    ^2.30.0
  firebase_auth:    ^4.19.0   # was ^4.17.0 — updated for stability
  cloud_firestore:  ^4.17.0   # was ^4.15.0 — minor patch

  # ── UI & utilities ──────────────────────────────────────────
  cupertino_icons:    ^1.0.8
  shared_preferences: ^2.2.2
  image_picker:       ^1.2.1
  geolocator:         ^12.0.0
  intl:               ^0.20.2
  provider:           ^6.1.5+1
  animations:         ^2.1.1
  lucide_icons:       ^0.257.0
  record:             5.0.0
  path_provider:      ^2.1.2
  audioplayers:       ^5.2.1

  # ── Map ─────────────────────────────────────────────────────
  flutter_map: ^7.0.2
  latlong2:    ^0.9.1

  # ── Network ─────────────────────────────────────────────────
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

dependency_overrides:
  record_platform_interface: 1.2.0